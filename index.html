*{box-sizing:border-box}

.meta{font-size:11px;color:#94a3b8;margin-top:6px;display:flex;justify-content:space-between}
.btn{width:100%;background:#22c55e;border:0;padding:12px;border-radius:12px;font-weight:800;margin-top:12px}
.count{font-size:12px;color:#94a3b8;margin-top:8px}
