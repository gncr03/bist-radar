<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#070b14;color:#fff;font-family:Arial;padding:14px}.top{background:#0f2a4a;border-radius:16px;padding:14px}.btn{background:#00b894;color:#fff;border:0;padding:14px;border-radius:12px;width:100%;font-weight:800}.box{background:#101c2e;border:1px solid #263b58;border-radius:14px;padding:12px;margin-top:12px}.m{color:#8fa3bd;font-size:12px}table{width:100%;font-size:13px}td,th{padding:8px 4px;border-bottom:1px solid #1f324d;text-align:right}th:first-child,td:first-child{text-align:left}</style></head><body><div class="top"><h1>BIST RADAR AI PRO</h1><div class="m">Otomatik 15 DK Gecikmeli - V308</div></div><div id="status" style="color:#ffc857;margin:12px 2px">Veri cekiliyor...</div><button class="btn" onclick="load()">YENILE - CANLI VERI</button><div class="box" id="top"></div><div class="box"><table><tr><th>Hisse</th><th>Fiyat</th><th>Deg</th><th>RSI</th><th>AI</th><th>Sinyal</th></tr><tbody id="rows"></tbody></table></div><div class="box m">Bu sistem GitHub Actions ile her 15 dakikada Yahoo'dan veri çeker. 15 dk gecikmeli BIST verisidir.</div><script>function G(i){return document.getElementById(i)}function rsi(p){if(p.length<15)return 50;var g=0,l=0;for(var i=1;i<15;i++){var d=p[i]-p[i-1];if(d>0)g+=d;else l-=d}var a=g/14,b=l/14;for(var i=15;i<p.length;i++){var d=p[i]-p[i-1];if(d>0){a=(a*13+d)/14;b=b*13/14}else{a=a*13/14;b=(b*13-d)/14}}if(b==0)return 85;var rs=a/b;return Math.round(100-100/(1+rs))}async function load(){try{var r=await fetch("data.json?v="+Date.now());var j=await r.json();var D=[];for(var i=0;i<j.length;i++){var x=j[i];var s=50;if(x.rsi<35)s=90;else if(x.rsi<45)s=70;else if(x.rsi<50)s=55;else if(x.rsi>=65)s=35;if(x.ch<=-2)s+=8;if(s>98)s=98;D.push({n:x.sym,p:x.price,c:x.ch,r:x.rsi,s:s,sg:s>=70?"AL":s<=32?"SAT":"BEKLE"})}D.sort(function(a,b){return b.s-a.s});var h="";for(var k=0;k<D.length;k++){var z=D[k];h+="<tr><td><b>"+z.n+"</b></td><td>"+z.p+"</td><td>"+z.c+"%</td><td>"+z.r+"</td><td><b>"+z.s+"</b></td><td>"+z.sg+"</td></tr>"}G("rows").innerHTML=h;G("top").innerHTML="<b>EN IYI: "+D[0].n+" - AI "+D[0].s+" - "+D[0].sg+"</b><div class=m>Fiyat "+D[0].p+" - RSI "+D[0].r+"</div>";G("status").innerHTML="Canli veri - Son guncelleme: "+j[0].time}catch(e){G("status").innerHTML="Henuz otomatik veri yok - 2. dosyayi ekle, 15 dk bekle"}}</script></body></html>
