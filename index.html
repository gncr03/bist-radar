<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIST 100 Canlı</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:white;margin:0;padding:12px}
.top{position:sticky;top:0;background:#0f172a;padding:10px 0;z-index:10}
h1{margin:0;font-size:22px}
.sub{color:#94a3b8;font-size:13px;margin:6px 0}
.btn{width:100%;padding:13px;background:#22c55e;color:white;border:none;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer}
.btn:active{background:#16a34a}
input{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;font-size:16px;box-sizing:border-box}
table{width:100%;border-collapse:collapse;margin-top:10px;background:#1e293b;border-radius:12px;overflow:hidden}
th,td{padding:10px 8px;text-align:left;font-size:14px}
th{background:#334155}
tr{border-bottom:1px solid #334155}
.up{color:#22c55e;font-weight:bold}
.down{color:#ef4444;font-weight:bold}
.badge{padding:3px 8px;border-radius:8px;font-size:12px}
</style>
</head>
<body>

<div class="top">
<h1>📈 BIST 100 Canlı</h1>
<div class="sub">Son Güncelleme: <b id="updated">Yükleniyor...</b> • Otomatik yenileme: Her 60 sn</div>
<button class="btn" onclick="loadData()">🔄 ŞİMDİ YENİLE</button>
<input id="search" placeholder="🔍 Hisse ara... Örn: THYAO" oninput="render()">
</div>

<table>
<thead><tr><th>Hisse</th><th>Fiyat</th><th>Değişim</th><th>RSI</th></tr></thead>
<tbody id="list"><tr><td colspan="4">Yükleniyor...</td></tr></tbody>
</table>

<script>
let allData = [];
async function loadData(){
  try{
    const res = await fetch('data.json?t=' + Date.now());
    const data = await res.json();
    document.getElementById('updated').innerText = data.updated || '-';
    allData = data.stocks || [];
    render();
  }catch(e){
    document.getElementById('list').innerHTML = '<tr><td colspan="4">Veri yüklenemedi</td></tr>';
  }
}
function render(){
  const q = document.getElementById('search').value.toUpperCase();
  const filtered = allData.filter(s => s.sym.includes(q));
  document.getElementById('list').innerHTML = filtered.map(s => {
    const cls = s.ch >= 0 ? 'up' : 'down';
    const sign = s.ch >= 0 ? '+' : '';
    let rsiColor = '#22c55e';
    if(s.rsi > 70) rsiColor = '#ef4444';
    else if(s.rsi < 30) rsiColor = '#eab308';
    return `<tr><td><b>${s.sym}</b></td><td>${s.price} ₺</td><td class="${cls}">${sign}%${s.ch}</td><td><span class="badge" style="background:${rsiColor}">${s.rsi}</span></td></tr>`;
  }).join('') || '<tr><td colspan="4">Bulunamadı</td></tr>';
}
loadData();
// OTOMATİK YENİLEME - 60 saniyede bir
setInterval(loadData, 60000);
</script>
</body>
</html>
