<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIST RADAR AI PRO</title>
<style>body{margin:0;background:#080d18;color:#fff;font-family:Arial;padding:14px}button{background:#1769c5;color:#fff;border:0;padding:12px;border-radius:10px;font-weight:700;width:100%}select,input{background:#0a1423;color:#fff;border:1px solid #344967;border-radius:9px;padding:10px;width:100%;margin-top:8px}.c{background:#111c2d;border:1px solid #2a3b55;border-radius:14px;padding:13px;margin:10px 0}.g{color:#22d6a0}.r{color:#ff657d}.y{color:#ffc857}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #203047;text-align:right}th:first-child,td:first-child{text-align:left}.m{color:#9aabc2;font-size:12px}</style></head>
<body>
<h1>BIST RADAR <span style="color:#55d9b3">AI PRO</span></h1><p class="m">RSI + Para Girisi - Otomatik emir yok</p>
<div id="status" style="color:#ffc857">Yukleniyor...</div>
<button onclick="scan()">TUM BISTI TARA - CANLI</button>
<select id="f" onchange="render()"><option value="ALL">Tumu</option><option value="AL">Sadece AL</option><option value="GIRIS">Sadece Para Girisi</option></select>
<input id="q" placeholder="Hisse ara: SISE" oninput="render()">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="c">AL adayi<div style="font-size:22px" id="buys">-</div></div><div class="c">Para Girisi<div style="font-size:22px" id="mg">-</div></div></div>
<div class="c"><b>EN IYI 5</b><div id="top"></div></div>
<div class="c"><b>TUM HISSELER</b><div style="overflow:auto"><table><tr><th>Hisse</th><th>Fiyat</th><th>Deg</th><th>RSI</th><th>Para</th><th>AI</th><th>Sinyal</th></tr><tbody id="rows"></tbody></table></div></div>
<div id="det" class="c m">Bir hisseye dokun, detay gor.</div>
<p class="m">Yatirim tavsiyesi degildir.</p>
<script>
function G(i){return document.getElementById(i)}
var F=[["SISE",38.12,-2.84,32,35,1.6],["EREGL",32.22,-1.47,36,38,1.3],["HEKTS",3.95,-0.5,39,37,1.4],["PETKM",19.85,-0.85,41,39,1.2],["SAHOL",98.4,-0.59,43,40,0.9],["KCHOL",205.5,-0.96,44,42,0.9],["TUPRS",356,-0.84,46,45,0.8],["YKBNK",37.4,-0.79,47,44,1],["AKBNK",69.9,-0.07,48,48,1],["BIMAS",395.25,-0.06,49,50,1],["GARAN",138.2,-0.13,50,52,1.1],["FROTO",1012,0.45,51,53,1],["ENKAI",82.7,-0.84,52,49,0.9],["TCELL",94.1,0.32,53,54,1],["THYAO",323.5,1.02,54,55,1.1],["PGSUS",262.5,1.42,55,58,1.2],["ASELS",353,2.17,63,62,1.4],["KOZAL",24.6,-0.44,42,41,1.1],["SASA",3.62,0.63,45,46,1.3],["EKGYO",18.55,0.38,40,43,1]];
function sc(r,m,c,v){var a=50;if(r<35)a=92;else if(r<40)a=82;else if(r<45)a=70;else if(r<50)a=55;else if(r>=70)a=15;else if(r>=60)a=35;var b=50;if(m<30)b=88;else if(m<40)b=72;else if(m<50)b=55;else if(m>=70)b=25;if(v>=1.5)b+=10;var t=Math.round(a*0.6+b*0.4);if(c<=-2)t+=4;if(t>100)t=100;return t}
function mk(a){var s=sc(a[3],a[4],a[2],a[5]);var mo="NOTR";if(a[4]<50&&a[5]>=1)mo="GIRIS";if(a[4]>=65)mo="CIKIS";var sg="BEKLE";if(s>=70)sg="AL";if(s<=35)sg="SAT";return{n:a[0],p:a[1],c:a[2],r:a[3],m:a[4],v:a[5],mo:mo,s:s,sg:sg}}
var data=[];for(var i=0;i<F.length;i++)data.push(mk(F[i]));
function render(){var f=G("f").value;var q=G("q").value.toUpperCase();var h="";var buys=0;var mg=0;for(var i=0;i<data.length;i++){if(data[i].sg==="AL")buys++;if(data[i].mo==="GIRIS")mg++}G("buys").innerHTML=buys;G("mg").innerHTML=mg;var srt=data.slice().sort(function(a,b){return b.s-a.s});var th="";for(var t=0;t<5;t++){var z=srt[t];th+="<div style='padding:8px 0'><b>"+(t+1)+". "+z.n+" - AI "+z.s+" - "+z.sg+"</b><br><span class='m'>RSI "+z.r+" MFI "+z.m+" "+z.mo+" - "+z.p.toFixed(2)+" TL</span></div>"}G("top").innerHTML=th;for(var j=0;j<data.length;j++){var x=data[j];if(f==="AL"&&x.sg!=="AL")continue;if(f==="GIRIS"&&x.mo!=="GIRIS")continue;if(q!==""&&x.n.indexOf(q)<0)continue;var cl="y";if(x.sg==="AL")cl="g";if(x.sg==="SAT")cl="r";h+="<tr onclick=\"det('"+x.n+"')\"><td><b>"+x.n+"</b></td><td>"+x.p.toFixed(2)+"</td><td>"+x.c.toFixed(2)+"%</td><td>"+x.r+"</td><td>"+x.mo+"</td><td><b>"+x.s+"</b></td><td class='"+cl+"'>"+x.sg+"</td></tr>"}G("rows").innerHTML=h;G("status").innerHTML="20 hisse hazir - 16 Kasim kapanis"}
function det(n){for(var i=0;i<data.length;i++){if(data[i].n===n){var x=data[i];G("det").innerHTML="<b>"+x.n+"</b> - "+x.p.toFixed(2)+" TL - "+x.c.toFixed(2)+"% - RSI "+x.r+" - MFI "+x.m+" - Hacim x"+x.v+" - "+x.mo+" - AI "+x.s+" - "+x.sg+" - Stop "+(x.p*0.99).toFixed(2)+" - Hedef "+(x.p*1.015).toFixed(2)}}}
function cRSI(p){if(p.length<15)return 50;var g=0,l=0;for(var i=1;i<15;i++){var d=p[i]-p[i-1];if(d>0)g+=d;else l-=d}var ag=g/14,al=l/14;for(var i=15;i<p.length;i++){var d=p[i]-p[i-1];if(d>0){ag=(ag*13+d)/14;al=al*13/14}else{ag=ag*13/14;al=(al*13-d)/14}}if(al===0)return 85;var rs=ag/al;return Math.round(100-100/(1+rs))}
function cMFI(cl,vo){try{if(cl.length<15)return 50;var po=0,ne=0;for(var i=cl.length-14;i<cl.length;i++){var tp=cl[i],pr=cl[i-1],mf=tp*(vo[i]||1);if(tp>pr)po+=mf;else if(tp<pr)ne+=mf}if(ne===0)return 85;var mr=po/ne;return Math.round(100-100/(1+mr))}catch(e){return 50}}
async function scan(){G("status").innerHTML="Taraniyor... 20 sn bekle...";var L=["THYAO.IS","ASELS.IS","KCHOL.IS","AKBNK.IS","EREGL.IS","SISE.IS","TUPRS.IS","BIMAS.IS","SAHOL.IS","GARAN.IS","YKBNK.IS","PETKM.IS","PGSUS.IS","ENKAI.IS","FROTO.IS","TCELL.IS","KOZAL.IS","SASA.IS","HEKTS.IS","EKGYO.IS"];var nd=[];for(var k=0;k<L.length;k++){try{var u="https://corsproxy.io/?url="+encodeURIComponent("https://query1.finance.yahoo.com/v8/finance/chart/"+L[k]+"?range=3mo&interval=1d");var r=await fetch(u);var j=await r.json();var res=j.chart.result[0];var q=res.indicators.quote[0];var cl=[],vo=[];for(var a=0;a<q.close.length;a++){if(q.close[a]!=null)cl.push(q.close[a])}for(var b=0;b<q.volume.length;b++){if(q.volume[b]!=null)vo.push(q.volume[b])}var meta=res.meta;var pr=meta.regularMarketPrice;var pv=meta.chartPreviousClose;var ch=(pr-pv)/pv*100;var rsi=cRSI(cl);var mfi=cMFI(cl,vo);var sv=0,cnt=0;for(var v=vo.length-20;v<vo.length-1;v++){if(v>=0){sv+=vo[v];cnt++}}var av=cnt>0?sv/cnt:1;var vr=av>0?vo[vo.length-1]/av:1;nd.push(mk([L[k].replace(".IS",""),pr,ch,rsi,mfi,vr]))}catch(e){}await new Promise(function(x){setTimeout(x,120)})}if(nd.length>10){data=nd;G("status").innerHTML="Canli tarandi - "+nd.length+" hisse"}else{G("status").innerHTML="Canli cekilemedi, kapanis verisi gosteriliyor."}render()}
render();
</script></body></html>
