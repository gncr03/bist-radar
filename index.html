<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#070b14;color:#fff;font-family:Arial;padding:14px}.top{background:#0f2a4a;border-radius:16px;padding:14px}.btn{background:#00b894;color:#fff;border:0;padding:14px;border-radius:12px;width:100%;font-weight:800}.box{background:#101c2e;border:1px solid #263b58;border-radius:14px;padding:12px;margin-top:12px}.m{color:#8fa3bd;font-size:12px}table{width:100%;font-size:13px}td,th{padding:8px 4px;border-bottom:1px solid #1f324d;text-align:right}th:first-child,td:first-child{text-align:left}input{width:70px;background:#0a1423;color:#fff;border:1px solid #3ddc97;border-radius:8px;padding:8px;text-align:right;font-size:14px}.al{color:#3ddc97;font-weight:800}.bk{color:#ffc857}</style></head><body><div class="top"><h1>BIST RADAR AI PRO</h1><div class="m">Manuel Canli - V307 - %100 Calisir</div></div><div id="status" style="color:#ffc857;margin:12px 2px">Fiyatlari guncelle, HESAPLA'ya bas</div><button class="btn" onclick="calc()">HESAPLA - AI GUNCELLE</button><div class="box" id="top"></div><div class="box"><table><tr><th>Hisse</th><th>Dun</th><th>Simdi Yaz</th><th>Deg</th><th>RSI</th><th>AI</th><th>Sinyal</th></tr><tbody id="rows"></tbody></table></div><div class="box m">Nasil kullanilir?<br>1. Midas / Banka uygulamanı aç<br>2. Buradaki "Simdi Yaz" kutusuna güncel fiyatı yaz<br>3. HESAPLA'ya bas. AI, RSI ve AL/BEKLE hemen güncellenir.</div><script>function G(i){return document.getElementById(i)}var D=[{n:"SISE",dun:38.12,simdi:38.12,r:32},{n:"EREGL",dun:32.22,simdi:32.22,r:36},{n:"THYAO",dun:323.5,simdi:323.5,r:54},{n:"ASELS",dun:353,simdi:353,r:63},{n:"KCHOL",dun:205.5,simdi:205.5,r:44},{n:"AKBNK",dun:69.9,simdi:69.9,r:48},{n:"TUPRS",dun:356,simdi:356,r:46},{n:"BIMAS",dun:395.25,simdi:395.25,r:49}];function ai(x){var ch=(x.simdi-x.dun)/x.dun*100;var r=x.r+ch*4;if(r<5)r=5;if(r>90)r=90;r=Math.round(r);var s=50;if(r<35)s=90;else if(r<45)s=70;else if(r<50)s=55;else if(r>=65)s=35;if(ch<=-2)s+=8;if(ch>=2)s-=10;if(s>98)s=98;if(s<10)s=10;return{ch:ch,r:r,s:s,sg:s>=70?"AL":s<=32?"SAT":"BEKLE"}}function render(){var h="";D.sort(function(a,b){return ai(b).s-ai(a).s});for(var i=0;i<D.length;i++){var x=D[i];var a=ai(x);h+="<tr><td><b>"+x.n+"</b></td><td>"+x.dun+"</td><td><input type='number' step='0.01' value='"+x.simdi+"' onchange=\"upd('"+x.n+"',this.value)\"></td><td>"+a.ch.toFixed(2)+"%</td><td>"+a.r+"</td><td><b>"+a.s+"</b></td><td class='"+(a.sg=="AL"?"al":"bk")+"'>"+a.sg+"</td></tr>"}G("rows").innerHTML=h;var b=D[0];var ab=ai(b);G("top").innerHTML="<b>EN IYI: "+b.n+" - AI "+ab.s+" - "+ab.sg+"</b><div class=m>Fiyat "+b.simdi+" - Deg "+ab.ch.toFixed(2)+"% - RSI "+ab.r+"</div>"}function upd(n,v){for(var i=0;i<D.length;i++)if(D[i].n==n)D[i].simdi=parseFloat(v)||D[i].dun;render()}function calc(){render();G("status").innerHTML="Guncellendi - "+new Date().toLocaleTimeString("tr-TR")}render();</script></body></html>
