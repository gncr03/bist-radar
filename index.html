<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#070b14;color:#fff;font-family:Arial;padding:14px}.top{background:#0f2a4a;border-radius:16px;padding:14px}.btn{background:#00b894;color:#fff;border:0;padding:14px;border-radius:12px;width:100%;font-weight:800}.box{background:#101c2e;border:1px solid #263b58;border-radius:14px;padding:12px;margin-top:12px}.m{color:#8fa3bd;font-size:12px}table{width:100%;font-size:13px}td,th{padding:8px 4px;border-bottom:1px solid #1f324d;text-align:right}th:first-child,td:first-child{text-align:left}</style></head><body><div class="top"><h1>BIST RADAR AI PRO</h1><div class="m">RSI + Stooq Canli - V306</div></div><div id="status" style="color:#ffc857;margin:12px 2px">Yukleniyor...</div><button class="btn" onclick="scan()">TARA - CANLI (STOOQ)</button><div class="box" id="top"></div><div class="box"><table><tr><th>Hisse</th><th>Fiyat</th><th>Deg</th><th>RSI</th><th>AI</th><th>Sinyal</th></tr><tbody id="rows"></tbody></table></div><script>function G(i){return document.getElementById(i)}var F=[["SISE",38.12,-2.84,32,1.6],["EREGL",32.22,-1.47,36,1.3],["THYAO",323.5,1.02,54,1.1],["ASELS",353,2.17,63,1.4],["KCHOL",205.5,-0.96,44,0.9],["AKBNK",69.9,-0.07,48,1],["TUPRS",356,-0.84,46,0.8],["BIMAS",395.25,-0.06,49,1]];function mk(a){var s=50;if(a[3]<35)s=90;else if(a[3]<45)s=70;else if(a[3]<50)s=55;if(a[4]>=1.5)s+=8;if(s>98)s=98;var sg=s>=70?"AL":s<=32?"SAT":"BEKLE";return{n:a[0],p:a[1],c:a[2],r:a[3],v:a[4],s:s,sg:sg}}var D=[];for(var i=0;i<F.length;i++)D.push(mk(F[i]));function render(){var h="";D.sort(function(a,b){return b.s-a.s});for(var i=0;i<D.length;i++){var x=D[i];h+="<tr><td><b>"+x.n+"</b></td><td>"+x.p+"</td><td>"+x.c+"%</td><td>"+x.r+"</td><td><b>"+x.s+"</b></td><td>"+x.sg+"</td></tr>"}G("rows").innerHTML=h;G("top").innerHTML="<b>EN IYI: "+D[0].n+" - AI "+D[0].s+" - "+D[0].sg+"</b><div class=m>Fiyat "+D[0].p+" - RSI "+D[0].r+"</div>"}function rsi(p){if(p.length<15)return 50;var g=0,l=0;for(var i=1;i<15;i++){var d=p[i]-p[i-1];if(d>0)g+=d;else l-=d}var a=g/14,b=l/14;for(var i=15;i<p.length;i++){var d=p[i]-p[i-1];if(d>0){a=(a*13+d)/14;b=b*13/14}else{a=a*13/14;b=(b*13-d)/14}}if(b==0)return 85;var rs=a/b;return Math.round(100-100/(1+rs))}async function getOne(sym){try{var r=await fetch("https://stooq.com/q/d/l/?s="+sym.toLowerCase()+".is&i=d");if(!r.ok)return null;var t=await r.text();var lines=t.trim().split("\n");if(lines.length<5)return null;var cl=[];for(var i=1;i<lines.length;i++){var p=lines[i].split(",");if(p[4])cl.push(parseFloat(p[4]))}if(cl.length<15)return null;var pr=cl[cl.length-1];var pv=cl[cl.length-2];return{pr:pr,ch:Math.round((pr-pv)/pv*10000)/100,r:rsi(cl)}}catch(e){return null}}async function scan(){G("status").innerHTML="Taraniyor... Stooq";var L=["THYAO","ASELS","KCHOL","AKBNK","EREGL","SISE","TUPRS","BIMAS"];var nd=[];for(var k=0;k<L.length;k++){var d=await getOne(L[k]);if(d){nd.push(mk([L[k],Math.round(d.pr*100)/100,d.ch,d.r,1]));G("status").innerHTML=nd.length+"/8 geldi..."}else{G("status").innerHTML="Atlandi "+L[k]+" - "+nd.length+"/8"}}if(nd.length>=3){D=nd;G("status").innerHTML="CANLI - "+nd.length+" hisse - "+new Date().toLocaleTimeString("tr-TR")}else{G("status").innerHTML="Stooq da cevap vermedi - 1 dk sonra tekrar dene"}render()}render();G("status").innerHTML="Hazir - TARA'ya bas";</script></body></html>
