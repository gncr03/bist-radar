<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#070b14;color:#fff;font-family:Arial;padding:14px}.top{background:#0f2a4a;border-radius:16px;padding:14px}.btn{background:#00b894;color:#fff;border:0;padding:14px;border-radius:12px;width:100%;font-weight:800}.box{background:#101c2e;border:1px solid #263b58;border-radius:14px;padding:12px;margin-top:12px}.m{color:#8fa3bd;font-size:12px}table{width:100%;font-size:13px}td,th{padding:8px 4px;border-bottom:1px solid #1f324d;text-align:right}th:first-child,td:first-child{text-align:left}</style></head><body><div class="top"><h1>BIST RADAR AI PRO</h1><div class="m">RSI + MFI + Hacim</div></div><div id="status" style="color:#ffc857;margin:12px 2px">Yukleniyor...</div><button class="btn" onclick="scan()">TARA - CANLI</button><div class="box" id="top"></div><div class="box"><table><tr><th>Hisse</th><th>Fiyat</th><th>Deg</th><th>RSI</th><th>AI</th><th>Sinyal</th></tr><tbody id="rows"></tbody></table></div><script>function G(i){return document.getElementById(i)}var F=[["SISE",38.12,-2.84,32,35,1.6],["EREGL",32.22,-1.47,36,38,1.3],["THYAO",323.5,1.02,54,55,1.1],["ASELS",353,2.17,63,62,1.4],["KCHOL",205.5,-0.96,44,42,0.9],["AKBNK",69.9,-0.07,48,48,1],["TUPRS",356,-0.84,46,45,0.8],["BIMAS",395.25,-0.06,49,50,1]];function mk(a){var s=50;if(a[3]<35)s=90;else if(a[3]<45)s=70;else if(a[3]<50)s=55;if(a[5]>=1.5)s+=10;var sg=s>=70?"AL":s<=32?"SAT":"BEKLE";return{n:a[0],p:a[1],c:a[2],r:a[3],m:a[4],v:a[5],s:s,sg:sg}}var D=[];for(var i=0;i<F.length;i++)D.push(mk(F[i]));function render(){var h="",t="";D.sort(function(a,b){return b.s-a.s});for(var i=0;i<D.length;i++){var x=D[i];h+="<tr><td><b>"+x.n+"</b></td><td>"+x.p+"</td><td>"+x.c+"%</td><td>"+x.r+"</td><td><b>"+x.s+"</b></td><td>"+x.sg+"</td></tr>"}G("rows").innerHTML=h;G("top").innerHTML="<b>EN IYI: "+D[0].n+" - AI "+D[0].s+" - "+D[0].sg+"</b><div class=m>Fiyat "+D[0].p+" - RSI "+D[0].r+" - Hacim x"+D[0].v+"</div>";G("status").innerHTML="20 hisse hazir - TARA'ya bas"}function rsi(p){if(p.length<15)return 50;var g=0,l=0;for(var i=1;i<15;i++){var d=p[i]-p[i-1];if(d>0)g+=d;else l-=d}var a=g/14,b=l/14;for(var i=15;i<p.length;i++){var d=p[i]-p[i-1];if(d>0){a=(a*13+d)/14;b=b*13/14}else{a=a*13/14;b=(b*13-d)/14}}if(b==0)return 85;var rs=a/b;return Math.round(100-100/(1+rs))}async function getJ(u){var ps=["https://corsproxy.io/?url=","https://api.allorigins.win/raw?url="];for(var i=0;i<ps.length;i++){try{var r=await fetch(ps[i]+encodeURIComponent(u));if(!r.ok)continue;var j=await r.json();if(j.chart&&j.chart.result[0])return j}catch(e){}}return null}async function scan(){G("status").innerHTML="Taraniyor...";var L=["THYAO.IS","ASELS.IS","KCHOL.IS","AKBNK.IS","EREGL.IS","SISE.IS","TUPRS.IS","BIMAS.IS"];var nd=[];for(var k=0;k<L.length;k++){try{var j=await getJ("https://query1.finance.yahoo.com/v8/finance/chart/"+L[k]+"?range=3mo&interval=1d");if(!j)continue;var q=j.chart.result[0].indicators.quote[0];var cl=[];for(var a=0;a<q.close.length;a++)if(q.close[a]!=null)cl.push(q.close[a]);var mt=j.chart.result[0].meta;var pr=mt.regularMarketPrice;var pv=mt.chartPreviousClose;nd.push(mk([L[k].replace(".IS",""),pr,(pr-pv)/pv*100,rsi(cl),50,1]));G("status").innerHTML=nd.length+"/8 geldi..."}catch(e){}}if(nd.length>4){D=nd;G("status").innerHTML="Canli tarandi - "+nd.length+" hisse"}else{G("status").innerHTML="Canli cekilemedi ("+nd.length+"/8)"}render()}render();</script></body></html>
