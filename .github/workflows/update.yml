name: BIST Update
on:
  schedule:
    - cron: '*/15 7-16 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas
      - run: |
          cat > fetch.py << 'PYEOF'
          import yfinance as yf, json, datetime
          syms = ['THYAO.IS','ASELS.IS','KCHOL.IS','AKBNK.IS','EREGL.IS','SISE.IS','TUPRS.IS','BIMAS.IS']
          out = []
          for s in syms:
              try:
                  df = yf.download(s, period='3mo', interval='1d', progress=False, auto_adjust=False)
                  cl = df['Close'].tolist()
                  cl = [float(x[0]) if isinstance(x, (list, tuple)) else float(x) for x in cl]
                  pr = cl[-1]
                  pv = cl[-2]
                  ch = round((pr-pv)/pv*100, 2)
                  g = 0
                  l = 0
                  for i in range(1, 15):
                      d = cl[i]-cl[i-1]
                      g += max(d, 0)
                      l += max(-d, 0)
                  a = g/14
                  b = l/14
                  for i in range(15, len(cl)):
                      d = cl[i]-cl[i-1]
                      if d > 0:
                          a = (a*13+d)/14
                          b = b*13/14
                      else:
                          a = a*13/14
                          b = (b*13-d)/14
                  rsi = round(100-100/(1+a/b)) if b != 0 else 85
                  out.append({'sym': s.replace('.IS',''), 'price': round(pr,2), 'ch': ch, 'rsi': rsi, 'time': datetime.datetime.now().strftime('%H:%M')})
              except Exception as e:
                  print(s, e)
          open('data.json','w').write(json.dumps(out))
          print(out)
          PYEOF
          python fetch.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add data.json
          git commit -m "auto" || echo "no change"
          git push
